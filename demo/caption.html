<!doctype html><meta charset="utf-8">
<!-- Caption card for the demo video. compose.py renders it with headless Chrome, passing the text in the URL hash. -->
<style>
  html, body { margin: 0; background: transparent; }
  body { width: 1280px; height: 110px; display: flex; align-items: center; justify-content: center; }
  p { margin: 0; max-width: 1060px; padding: 12px 22px; border-radius: 8px; background: rgba(13, 42, 28, 0.9); color: #f6f7f5; box-shadow: 0 0 0 1.5px rgba(246, 247, 245, 0.45);
      font: 600 26px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif; text-align: center; }
</style>
<p id="t"></p>
<script>document.getElementById('t').textContent = decodeURIComponent(location.hash.slice(1));</script>
